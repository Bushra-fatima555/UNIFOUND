
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Item | Uni-Find</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            padding: 40px 20px;
            color: #263238;
        }

        .delete-container {
            max-width: 500px;
            margin: 80px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            text-align: center;
        }

        h2 {
            color: #174A5B;
        }

        button {
            background: #dc3545;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #174A5B;
            margin-left: 15px;
        }
    </style>
</head>

<body>

    <div class="delete-container">

        <h2>Delete Item</h2>

        <p>
            Are you sure you want to delete
            <strong>{{ item.item_name }}</strong>?
        </p>

        <p>This action cannot be undone.</p>

        <form method="POST">
            {% csrf_token %}

            <button type="submit">
                Yes, Delete
            </button>

            <a href="{% url 'item_detail' item.id %}">
                Cancel
            </a>

        </form>

    </div>

</body>
</html>
