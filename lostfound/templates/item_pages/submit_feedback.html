
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UNIFOUND | Submit Feedback</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #F7F3EA;
            font-family: Arial, sans-serif;
            color: #405443;
            min-height: 100vh;
        }

        .navbar {
            background: #E5EBDD;
            padding: 18px 35px;
        }

        .brand {
            color: #405443;
            font-size: 25px;
            font-weight: bold;
            text-decoration: none;
        }

        .main-container {
            max-width: 650px;
            margin: 55px auto;
            padding: 20px;
        }

        .feedback-card {
            background: white;
            border-radius: 18px;
            padding: 35px;
            box-shadow: 0 5px 20px rgba(64, 84, 67, 0.08);
        }

        h2 {
            color: #405443;
            font-weight: bold;
        }

        .form-label {
            font-weight: 600;
            color: #526B56;
        }

        .form-control, .form-select {
            border: 1px solid #D5DFD0;
            border-radius: 9px;
            padding: 12px;
        }

        .form-control:focus, .form-select:focus {
            border-color: #71866A;
            box-shadow: 0 0 0 0.2rem rgba(113, 134, 106, 0.15);
        }

        .submit-btn {
            background: #71866A;
            color: white;
            border: none;
            border-radius: 9px;
            padding: 12px 25px;
            font-weight: bold;
            width: 100%;
        }

        .submit-btn:hover {
            background: #526B56;
            color: white;
        }

        .back-link {
            color: #526B56;
            text-decoration: none;
            font-weight: 600;
        }

        .back-link:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

<nav class="navbar">
    <a href="{% url 'item_list' %}" class="brand">UNIFOUND</a>
</nav>

<div class="main-container">

    <div class="feedback-card">

        <div class="text-center mb-4">
            <h2>Share Your Feedback</h2>
            <p class="text-muted">
                Your feedback helps us improve UNIFOUND.
            </p>
        </div>

        {% if success %}
            <div class="alert alert-success">
                {{ success }}
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-danger">
                {{ error }}
            </div>
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Feedback Subject</label>
                <input
                    type="text"
                    name="subject"
                    class="form-control"
                    placeholder="Enter feedback subject"
                    maxlength="200"
                    required
                >
            </div>

            <div class="mb-3">
                <label class="form-label">Your Rating</label>

                <select name="rating" class="form-select" required>
                    <option value="5">5 - Excellent</option>
                    <option value="4">4 - Very Good</option>
                    <option value="3">3 - Good</option>
                    <option value="2">2 - Fair</option>
                    <option value="1">1 - Poor</option>
                </select>
            </div>

            <div class="mb-4">
                <label class="form-label">Your Message</label>
                <textarea
                    name="message"
                    class="form-control"
                    rows="5"
                    placeholder="Write your feedback here..."
                    required
                ></textarea>
            </div>

            <button type="submit" class="submit-btn">
                Submit Feedback
            </button>

        </form>

        <div class="text-center mt-4">
            <a href="{% url 'item_list' %}" class="back-link">
                ← Back to Lost & Found
            </a>
        </div>

    </div>

</div>

</body>
</html>
