
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item | UniFind</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <style>
        .report-page {
            min-height: 100vh;
            padding: 55px 20px;
            background: var(--cream);
            font-family: 'DM Sans', sans-serif;
        }

        .report-container {
            max-width: 680px;
            margin: auto;
        }

        .report-topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 35px;
            gap: 15px;
        }

        .report-logo {
            color: var(--dark-green);
            font-size: 23px;
            font-weight: 800;
            text-decoration: none;
        }

        .report-logo span {
            color: var(--deep-sage);
        }

        .back-link {
            color: var(--deep-sage);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .report-card {
            background: white;
            padding: 40px;
            border: 1px solid var(--border);
            border-radius: 18px;
            box-shadow: var(--shadow);
        }

        .report-heading {
            text-align: center;
            margin-bottom: 32px;
        }

        .report-eyebrow {
            color: var(--deep-sage);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .report-heading h1 {
            font-family: 'Playfair Display', serif;
            color: var(--dark-green);
            font-size: 36px;
            margin: 12px 0;
        }

        .report-heading p {
            color: var(--muted);
            font-size: 13px;
            line-height: 1.8;
        }

        .report-form p {
            margin-bottom: 20px;
        }

        .report-form label {
            display: block;
            color: var(--text);
            font-size: 13px;
            font-weight: 700;
            margin-bottom: 8px;
        }

        .report-form input,
        .report-form select,
        .report-form textarea {
            width: 100%;
            min-height: 48px;
            padding: 12px 14px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: #FCFCFA;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 13px;
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }

        .report-form textarea {
            min-height: 110px;
            resize: vertical;
        }

        .report-form input:focus,
        .report-form select:focus,
        .report-form textarea:focus {
            border-color: var(--sage);
            background: white;
            box-shadow: 0 0 0 3px rgba(168,185,160,0.15);
        }

        .report-form input[type="file"] {
            padding: 10px;
            background: var(--sage-light);
        }

        .report-form .helptext {
            display: block;
            color: var(--muted);
            font-size: 11px;
            margin-top: 6px;
        }

        .report-form ul.errorlist {
            color: #B54747;
            font-size: 12px;
            padding-left: 18px;
            margin: 5px 0;
        }

        .submit-report-btn {
            width: 100%;
            min-height: 50px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            background: var(--deep-sage);
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-report-btn:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
        }

        .view-items-link {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: var(--deep-sage);
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .view-items-link:hover,
        .back-link:hover {
            color: var(--dark-green);
        }

        @media (max-width: 600px) {
            .report-page {
                padding: 30px 15px;
            }

            .report-card {
                padding: 25px 20px;
            }

            .report-heading h1 {
                font-size: 29px;
            }
        }
    </style>
</head>

<body>

<div class="report-page">

    <div class="report-container">

        <div class="report-topbar">
            <a href="/" class="report-logo">UniFind<span>.</span></a>

            <a href="{% url 'item_list' %}" class="back-link">
                ← Back to Items
            </a>
        </div>

        <div class="report-card">

            <div class="report-heading">
                <span class="report-eyebrow">HELP YOUR CAMPUS COMMUNITY</span>

                <h1>Report an Item</h1>

                <p>
                    Lost something or found something?
                    Share its details to help reunite items with their owners.
                </p>
            </div>

            <form method="POST" enctype="multipart/form-data" class="report-form">
                {% csrf_token %}

                {{ form.as_p }}

                <button type="submit" class="submit-report-btn">
                    Submit Report →
                </button>
            </form>

            <a href="{% url 'item_list' %}" class="view-items-link">
                View All Lost & Found Items
            </a>

        </div>

    </div>

</div>

</body>
</html>
