
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item | Uni-Find</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            padding: 40px 20px;
            color: #263238;
        }

        .form-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
            color: #174A5B;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px;
            margin: 10px 0 20px;
            border: 1px solid #d5dfe3;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #174A5B;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>
    <div class="form-container">
        <h1>Report Lost or Found Item</h1>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <button type="submit">Submit Report</button>
        </form>

        <a href="{% url 'item_list' %}">
            View All Items
        </a>
    </div>
</body>
</html>
