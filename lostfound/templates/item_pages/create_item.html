
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Item | Uni-Find</title>

    <style>
        :root {
            --cream: #F8F7F1;
            --white: #FFFFFF;
            --sage: #A8B9A0;
            --sage-light: #EAF0E6;
            --deep-sage: #526B57;
            --dark-green: #344B3A;
            --text: #343C35;
            --muted: #818980;
            --border: #E7E9E1;
            --shadow: 0 15px 40px rgba(52, 75, 58, 0.08);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 55px 20px;
            font-family: 'DM Sans', Arial, sans-serif;
            background: var(--cream);
            color: var(--text);
        }

        .form-container {
            max-width: 700px;
            margin: auto;
            padding: 40px 45px;
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: 20px;
            box-shadow: var(--shadow);
        }

        .badge {
            display: table;
            margin: 0 auto 18px;
            padding: 10px 20px;
            background: var(--sage-light);
            color: var(--deep-sage);
            border-radius: 30px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 1px;
        }

        h1 {
            margin: 0;
            text-align: center;
            color: var(--dark-green);
            font-family: 'Playfair Display', Georgia, serif;
            font-size: 36px;
            font-weight: 700;
        }

        .subtitle {
            margin: 12px 0 35px;
            text-align: center;
            color: var(--muted);
            font-size: 15px;
            line-height: 1.7;
        }

        form p {
            margin: 0 0 22px;
        }

        form label {
            display: block;
            margin-bottom: 9px;
            color: var(--text);
            font-size: 14px;
            font-weight: 600;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 15px;
            background: #FCFCFA;
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'DM Sans', Arial, sans-serif;
            font-size: 14px;
            outline: none;
            transition: 0.2s ease;
        }

        input,
        select {
            min-height: 48px;
        }

        textarea {
            min-height: 120px;
            resize: vertical;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--sage);
            box-shadow: 0 0 0 3px rgba(168, 185, 160, 0.18);
            background: var(--white);
        }

        input[type="file"] {
            padding: 11px;
        }

        input[type="checkbox"],
        input[type="radio"] {
            width: auto;
            min-height: auto;
        }

        .helptext {
            display: block;
            margin-top: 7px;
            color: var(--muted);
            font-size: 12px;
        }

        .errorlist {
            color: #B54747;
            font-size: 13px;
            padding-left: 20px;
        }

        button {
            width: 100%;
            margin-top: 8px;
            padding: 15px;
            background: var(--deep-sage);
            color: var(--white);
            border: none;
            border-radius: 10px;
            font-family: 'DM Sans', Arial, sans-serif;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        button:hover {
            background: var(--dark-green);
            transform: translateY(-2px);
        }

        .back-link {
            display: block;
            margin-top: 25px;
            text-align: center;
            color: var(--deep-sage);
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
        }

        .back-link:hover {
            color: var(--dark-green);
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            body {
                padding: 25px 14px;
            }

            .form-container {
                padding: 28px 20px;
                border-radius: 16px;
            }

            h1 {
                font-size: 28px;
            }
        }
    </style>
</head>

<body>
    <div class="form-container">

        <div class="badge">UNI-FIND COMMUNITY</div>

        <h1>Report Lost or Found Item</h1>

        <p class="subtitle">
            Help reconnect lost belongings with their owners.
            Share the details of your item below.
        </p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit">Submit Report</button>
        </form>

        <a href="{% url 'item_list' %}" class="back-link">
            ← Back to All Items
        </a>

    </div>
</body>
</html>
