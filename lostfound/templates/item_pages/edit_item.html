
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Item | Uni-Find</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f7f8;
            padding: 40px 20px;
            color: #263238;
        }

        .form-container {
            max-width: 650px;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 12px;
        }

        h1 {
            color: #174A5B;
            text-align: center;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input, select, textarea {
            width: 100%;
            padding: 11px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
        }

        button {
            background: #174A5B;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        a {
            color: #174A5B;
            margin-left: 12px;
        }
    </style>
</head>

<body>

<div class="form-container">

    <h1>Edit Item</h1>

    <form method="POST" enctype="multipart/form-data">

        {% csrf_token %}

        {% for field in form %}

            <div class="form-group">

                <label>{{ field.label }}</label>

                {{ field }}

                {% if field.errors %}
                    <p>{{ field.errors }}</p>
                {% endif %}

            </div>

        {% endfor %}

        <button type="submit">Update Item</button>

        <a href="{% url 'item_detail' item.id %}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
