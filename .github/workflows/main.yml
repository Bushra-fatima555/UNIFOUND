
name: UNIFOUND CI Pipeline

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  django-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Locate Django Project
        id: locate
        run: |
          FILE=$(find . -name manage.py -not -path '*/.venv/*' -print -quit)

          if [ -z "$FILE" ]; then
            echo "manage.py not found in repository"
            exit 1
          fi

          DIR=$(dirname "$FILE")
          echo "project_dir=$DIR" >> "$GITHUB_OUTPUT"
          echo "Found Django project: $DIR"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Django

      - name: Run Django Check
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          DJANGO_SECRET_KEY: test-secret-key
        run: python manage.py check
