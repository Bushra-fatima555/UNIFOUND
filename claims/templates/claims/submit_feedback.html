<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>UNIFOUND | Submit Feedback</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background: #F7F3EA; color: #405443; }
        .feedback-card { max-width: 650px; margin: 60px auto; background: white; padding: 30px; border-radius: 16px; }
        .btn-main { background: #71866A; color: white; }
    </style>
</head>
<body>
<div class="container">
    <div class="feedback-card">
        <h2 class="fw-bold mb-2">Share Your Feedback</h2>
        <p class="text-muted">Help us improve UNIFOUND.</p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Your Name</label>
                <input type="text" name="student_name" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Email</label>
                <input type="email" name="email" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Subject</label>
                <input type="text" name="subject" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Feedback</label>
                <textarea name="message" class="form-control" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-main w-100">Submit Feedback</button>
        </form>
    </div>
</div>
</body>
</html>
